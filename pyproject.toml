[project]
name = "harbor-native-spike"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["PyYAML==6.0.3", "harbor==0.21.0", "fastjsonschema==2.22.2"]
[dependency-groups]
dev = ["pytest==8.4.2"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/native_spike", "src/acceptance"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: unpaid real native Harbor/Docker trials"]

[tool.ruff]
line-length = 120
target-version = "py314"
